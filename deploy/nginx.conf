# Add these locations inside the dedicated virtual host for the course domain.
# Keep existing sites intact. Configure the host's TLS certificate separately.
# Test configuration with nginx -t before reload.
# 25 MiB audio + 8 MiB image, with room for multipart form overhead.
client_max_body_size 40m;

location / {
    proxy_pass http://127.0.0.1:8017;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 70s;
    proxy_redirect off;
}

# Do not create a public /media/ alias. Files are served by authenticated views.
