<section id="project-editor" aria-labelledby="project-editor-title"><h2 id="project-editor-title">项目演示 <span class="optional">选填</span></h2><p class="help-text">按顺序介绍每个作品并上传 MP4（每个不超过 25 MB）；最多 10 个项目。本次上传文件合计不超过 64 MB。空白项目不会保存。</p>{{ project_formset.management_form }}{{ project_formset.non_form_errors }}<div id="project-rows">{% for project_form in project_formset %}{% include 'board/includes/project_row.html' %}{% endfor %}</div><template id="project-empty-form">{% include 'board/includes/project_row.html' with project_form=project_formset.empty_form %}</template><button class="button secondary" type="button" id="project-add">添加项目</button><p class="help-text">若提交验证失败，请重新选择需要上传的文件。</p><p id="project-upload-error" role="alert" hidden></p></section>
