{% extends 'base.html' %}
{% block title %}删除内容{% endblock %}
{% block content %}<div class="narrow-content"><section class="form-card"><h1>删除这条内容？</h1><p class="muted">{{ object.title|default:object.body|truncatechars:100 }}</p><p>删除后，其他同学将无法再查看这条内容。此操作不可撤销。</p><form method="post" class="form-actions">{% csrf_token %}<a class="button secondary" href="{{ cancel_url }}">保留内容</a><button class="button danger" type="submit">确认删除</button></form></section></div>{% endblock %}
